name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Generar el Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x gradlew

      - name: Compilar APK de depuración (debug)
        run: ./gradlew assembleDebug

      - name: Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: ferro-dlna-debug-apk
          path: app/build/outputs/apk/debug/*.apk
